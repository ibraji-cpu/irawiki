name: Deploy Wiki & Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_PUBLIC_KEY }}" >> ~/.ssh/known_hosts

      - name: Rebuild & deploy wiki
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "export PATH=/home/ubuntu/.local/bin:\$PATH && cd /home/ubuntu/irawiki && git fetch origin main && git checkout main && git reset --hard origin/main && bash build_wiki.sh"

  deploy-blog:
    runs-on: ubuntu-latest
    needs: deploy-wiki
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_PUBLIC_KEY }}" >> ~/.ssh/known_hosts

      - name: Rebuild & deploy blog
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "export PATH=/home/ubuntu/.local/bin:\$PATH && cd /home/ubuntu/irawiki && git fetch origin main && git checkout main && git reset --hard origin/main && git submodule update --init --recursive && bash blog/publish.sh"
