server {
    server_name wiki.iraamalia.id;

    root /home/ubuntu/irawiki/public;
    index index.html;

    access_log /var/log/nginx/wiki.iraamalia.access.log;
    error_log  /var/log/nginx/wiki.iraamalia.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml image/png;

    location /actors {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /events {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /search {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /proposals {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /muse/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Real 404: unknown paths get the Quartz 404 page WITH status 404 (no soft-404).
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    location = /llms.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    location = /llms-full.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wiki.iraamalia.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wiki.iraamalia.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = wiki.iraamalia.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name wiki.iraamalia.id;
    return 404; # managed by Certbot


}
