<link rel="manifest" href="{{ "site.webmanifest" | absURL }}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1e20" media="(prefers-color-scheme: dark)">
<style>
.ai-label {
  margin: 0 0 1.5rem 0;
  padding: .75rem 1rem;
  border-left: 4px solid #e0a800;
  background: rgba(224, 168, 0, .12);
  border-radius: 6px;
  font-size: .95rem;
}
.audio-summary-box {
  margin: 0 0 1.5rem 0;
  padding: 1rem 1.25rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 12px;
  color: #fff;
}
.audio-summary-label {
  font-size: .95rem;
  font-weight: 600;
  margin-bottom: .5rem;
  letter-spacing: .02em;
}
.audio-summary-player {
  width: 100%;
  height: 40px;
  border-radius: 8px;
  outline: none;
}
</style>
<style>
.logo a img {
  height: 40px;
  width: auto;
  margin-inline-end: 0;
  transform: none;
  border-radius: 0;
}
.site-banner {
  width: 100%;
  line-height: 0;
  margin-bottom: var(--gap, 24px);
}
.site-banner img {
  display: block;
  width: 100%;
  height: auto;          /* rasio asli 4:1, tidak di-crop */
  max-height: 480px;
  object-fit: contain;
}
</style>
<style>
/* Kategori Grid & Card Styles */
.kategori {
  margin: 0 0 2rem 0;
}
.kategori-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem;
}
@media (max-width: 640px) {
  .kategori-grid {
    grid-template-columns: 1fr;
  }
}
.kategori-card {
  display: flex;
  flex-direction: column;
  padding: 1.1rem 1.25rem;
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: 14px;
  text-decoration: none;
  color: var(--primary);
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.kategori-card:hover {
  transform: translateY(-2px);
  border-color: var(--tertiary);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .05);
}
.kategori-name {
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: .25rem;
  color: var(--primary);
}
.kategori-count {
  font-size: .75rem;
  font-weight: 600;
  color: var(--secondary);
  background: var(--border);
  padding: .15rem .5rem;
  border-radius: 999px;
  align-self: flex-start;
  margin-bottom: .4rem;
}
.kategori-desc {
  font-size: .88rem;
  line-height: 1.45;
  color: var(--secondary);
}

/* Audio Badge pada Kartu Artikel */
.audio-badge {
  display: inline-block;
  font-size: .75rem;
  font-weight: 600;
  color: #4f46e5;
  background: rgba(79, 70, 229, .12);
  padding: .15rem .55rem;
  border-radius: 999px;
  margin-bottom: .35rem;
  white-space: nowrap;
}
[data-theme="dark"] .audio-badge {
  color: #a5b4fc;
  background: rgba(165, 180, 252, .16);
}
</style>
<style>
/* Kartu update wiki di beranda blog */
.wiki-updates { margin: 0 0 2rem 0; padding: 1.25rem 1.35rem; border: 1px solid var(--border); border-radius: 14px; background: var(--entry); }
.wiki-updates-head h2 { margin: 0 0 .25rem; font-size: 1.35rem; }
.wiki-updates-sub { margin: 0 0 1rem; font-size: .85rem; opacity: .7; }
.wiki-update-card { padding: .9rem 0; border-top: 1px dashed var(--border); }
.wiki-update-card:first-of-type { border-top: 0; padding-top: .25rem; }
.wiki-update-top { display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; margin-bottom: .35rem; }
.wiki-badge { font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: .15rem .5rem; border-radius: 999px; white-space: nowrap; }
.wiki-badge--baru { color: #0b6b3a; background: rgba(16, 185, 129, .16); }
.wiki-badge--diperbarui { color: #8a5a00; background: rgba(224, 168, 0, .18); }
.wiki-update-title { font-weight: 600; font-size: 1.02rem; line-height: 1.35; text-decoration: none; }
.wiki-update-title:hover { text-decoration: underline; }
.wiki-update-summary { margin: .15rem 0 .45rem; font-size: .93rem; line-height: 1.55; opacity: .88; }
.wiki-update-link { font-size: .85rem; font-weight: 600; text-decoration: none; }
.wiki-updates-more { margin: .85rem 0 0; font-size: .88rem; }
</style>
<style>
/* Header & nav sticky — modern, blur, menyusut saat scroll */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: color-mix(in srgb, var(--theme) 82%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid transparent;
  transition: box-shadow .25s ease, border-color .25s ease;
}
.header .nav { transition: min-height .25s ease; }
.header .logo a img { transition: height .25s ease; }
.header.is-scrolled {
  border-bottom-color: var(--border);
  box-shadow: 0 4px 18px rgba(0, 0, 0, .06);
}
.header.is-scrolled .logo a img { height: 32px; }
/* Anchor/TOC tidak tertutup header */
html { scroll-padding-top: 80px; }
@media (prefers-reduced-motion: reduce) {
  .header, .header .nav, .header .logo a img { transition: none; }
}
</style>
